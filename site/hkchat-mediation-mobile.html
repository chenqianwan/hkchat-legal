 repair:{name:'维修改期',icon:'tool',prompt:'师傅临时改期，我白请了一天假',title:'请了假，师傅却没来',place:'深水埗 · 虚构个案',story:'阿晴约了周三上午维修水喉，特意请假在家。许师傅当天改期，两人对通知时间和补偿各有说法。',people:[{name:'阿晴',role:'住户',letter:'晴',opening:'我不是不能改期，但我请了假，等了整个上午。至少要给我一个确定的时间。'},{name:'许师傅',role:'维修师傅',letter:'许',opening:'上一个工程出了状况。我说过可能晚一点，但没有确认她是否看到消息。'}],interest:['我最在意别再白等。能否约一个下班后、确定的时段？误工损失我也想谈。','我愿意重新排期，也可以先把时间写清楚。但我不能没核对记录就答应所有赔偿。'],facts:['我保留了预约和请假记录；当天下午才看到改期消息。我们可以一起对时间。','我也有通话记录和报价单。先把原先承诺与实际通知对齐。'],pressure:['我希望我的损失被听见，但也想尽快修好水喉。','一开始就要求我承担所有损失，我无法同意。可以先说清楚发生了什么。'],options:[{label:'约周六晚间两小时时段',detail:'18:00–20:00，并提前确认',agreement:'双方愿意改约周六 18:00–20:00，并提前确认。',a:'周六晚上我在家，这个时间我同意。',b:'周六 18:00–20:00 我可以安排，并会提前确认。'},{label:'一起核对原来的记录',detail:'预约、报价与改期通知',agreement:'双方愿意一起核对预约、报价和改期通知。',a:'我同意拿出预约和请假记录。',b:'我同意提供报价和通知记录一起核对。'},{label:'现在承诺赔全天工资',detail:'尚未核对损失与责任',a:'如果能补回实际损失，我愿意接受这个方向。',b:'我还没有确认损失与责任，暂时不同意承诺全天工资。'}],open:'误工损失是否需要补偿、金额多少，双方还没有达成共识。',fact:'原定到场时段、改期通知的发送与接收时间，以及实际损失记录。',habit:'把「尽快修好」和「补偿争议」分开谈，可以先处理双方愿意推进的部分。'},

function footer(){return'<p class="md-foot">情境生成演示 · 虚构个案</p>'}
function primary(action,text){return'<button class="md-primary" type="button" data-action="'+action+'">'+text+' '+icon('arrow')+'</button>'}
function home(){return'<section class="md-hero"><div class="md-art" aria-hidden="true"><span class="md-art-person a">晴</span><span class="md-art-person b">许</span><div class="md-art-bubble">不如，倾下先。<span>从争执里，找到下一步</span></div><i>'+icon('chat')+'</i></div><span class="md-eyebrow">HKChat · AI 调解室</span><h1 tabindex="-1" data-focus>街坊和事佬</h1><p>两边都有话说，换你来协调。</p><div class="md-meta"><span>3 轮对话</span><i></i><span>可随时收尾</span></div></section>'+(run()?'<button class="md-resume" type="button" data-action="resume">'+icon('chat')+'<span>'+(state.run.turns.length===3?'回看这次协调':'继续这次协调')+'<small>'+esc(CASES[run().caseId].title)+'</small></span>'+icon('arrow')+'</button>':'')+'<h2 class="md-small-heading">从哪件小事开始？</h2><div class="md-cases">'+Object.entries(CASES).map(([id,c])=>'<button class="md-case" type="button" data-case="'+id+'" aria-pressed="'+String(match(state.draft)===id)+'"><img class="md-case-photo" src="'+scenePhotos[id]+'" alt="" width="640" height="480" decoding="async"><span class="md-case-symbol" aria-hidden="true">'+icon(c.icon)+'</span><span class="md-case-selected" aria-hidden="true">'+icon('check')+'</span><span class="md-case-copy"><strong>'+c.name+'</strong><span>'+esc(c.prompt)+'</span></span></button>').join('')+'</div><form id="md-generator"><label class="md-label" for="md-topic">也可以说说你想练习的矛盾</label><textarea id="md-topic" maxlength="160" rows="2" placeholder="例如：师傅改期，害我白请了一天假">'+esc(state.draft)+'</textarea><p class="md-error" id="md-error" aria-live="polite">'+esc(error)+'</p><button class="md-primary" type="submit" data-action="generate">'+icon('spark')+' 生成协调情境</button></form>'+footer()}
function generating(){return'<div class="md-generating" role="status" aria-live="polite"><div class="md-orbit">'+icon('people')+'<i></i></div><span class="md-eyebrow">正在准备你的调解室</span><h1 tabindex="-1" data-focus>'+['把生活小事变成情境','听见双方不同的需要','请你来做和事佬'][busy.step]+'</h1><p>'+esc(busy.topic)+'</p><div class="md-loading-dots"><i></i><i></i><i></i></div><button class="md-text-button" type="button" data-action="cancel">取消</button></div>'}
function top(){return'<div class="md-topline"><button class="md-back" type="button" data-action="home">'+icon('back')+' 街坊和事佬</button><span>虚构个案</span></div>'}
function speaker(p,text,chair=false){return'<article class="md-speech'+(chair?' chair':'')+'"><div class="md-speaker"><span class="md-avatar">'+(chair?icon('spark'):esc(p.letter))+'</span><strong>'+esc(p.name)+'</strong><small>'+esc(p.role)+'</small></div><p>'+esc(text)+'</p></article>'}
const chair={name:'乔姐',role:'AI 调解主持'};
function brief(){const c=scene();return top()+'<section class="md-case-intro"><span class="md-eyebrow">'+c.place+'</span><h1 tabindex="-1" data-focus>'+c.title+'</h1><p>'+c.story+'</p></section><div class="md-parties">'+c.people.map(p=>'<div><span class="md-avatar">'+p.letter+'</span><strong>'+p.name+'</strong><small>'+p.role+'</small></div>').join('')+'<div><span class="md-avatar chair">'+icon('spark')+'</span><strong>乔姐</strong><small>AI 调解主持</small></div></div><div class="md-notice">'+icon('chat')+'<p>你来提问、给出方案。双方会表达意愿，谈不拢的部分也可以留下。</p></div>'+primary('begin','开始协调')+footer()}
function response(turn){const c=scene();if(turn.kind==='interests')return{lines:c.interest,host:'先把需求听清楚：哪些是现在能推进的，哪些还需要核对？'};if(turn.kind==='facts')return{lines:c.facts,host:'双方愿意说明各自掌握的记录。下一轮可以把核对事实写进方案。'};if(turn.kind==='pressure')return{lines:c.pressure,host:'直接分对错，容易让对话停住。我们可以先找一个双方愿意做的小安排。'};if(turn.kind==='clarify')return{lines:c.interest,host:'你的问题已记下。我们先从双方的核心需要开始，再提出具体安排。'};const selected=validChoices(turn.choices);return{lines:[0,1].map(i=>selected.length?selected.map(n=>c.options[n][i?'b':'a']).join(' '):'这段发言还没有包含可确认的具体安排，我暂时不能作出承诺。'),host:selected.length?(selected.includes(2)?(selected.some(i=>i<2)?'他们分别回应了每一项。已同意的安排可以保留，争议条件仍要继续谈。':'这项安排还没有得到双方同意。你可以调整条件，也可以保留分歧。'):'这几项安排双方都愿意推进。没有提到的争议，我们仍然保留。'):'可以先选一个具体安排，让双方逐项回应。'}}
function responses(turn){const res=response(turn),c=scene();return'<section class="md-responses" aria-label="双方回应"><div class="md-user"><span>你的发言</span><p>'+esc(turn.text||'我提议按以下安排协调。')+'</p>'+(turn.choices.length?'<div>'+turn.choices.map(i=>'<span>'+esc(c.options[i].label)+'</span>').join('')+'</div>':'')+'</div>'+c.people.map((p,i)=>speaker(p,res.lines[i])).join('')+speaker(chair,res.host+(turn.kind==='proposal'&&turn.text?' 补充发言已记录；具体共识只包含双方回应过的勾选安排。':''),true)+'</section>'}
function progress(){return'<div class="md-progress"><span>第 <b>'+(run().round+1)+'</b> / 3 轮</span><div>'+[0,1,2].map(i=>'<i class="'+(i<=run().round?'active':'')+'"></i>').join('')+'</div><span>'+['听听需要','提出方案','再调一调'][run().round]+'</span></div>'}
function plan(){const r=run(),c=scene();return'<div class="md-plan"><div class="md-section-head"><h2>'+(r.round===2?'调整你的协调方案':'拼一个协调方案')+'</h2><span>可以多选</span></div>'+(r.round===2?'<p class="md-plan-note">新方案会替代上一轮，请双方重新确认。</p>':'')+c.options.map((o,i)=>'<label class="md-option'+(r.choices.includes(i)?' selected':'')+'"><input type="checkbox" data-option="'+i+'"'+(r.choices.includes(i)?' checked':'')+(busy?' disabled':'')+'><span><strong>'+o.label+'</strong><small>'+o.detail+'</small></span></label>').join('')+'</div>'}
function play(){const r=run(),c=scene(),answered=r.turns.length>r.round;return top()+progress()+'<div class="md-room-heading"><h1 tabindex="-1" data-focus>'+c.title+'</h1><button class="md-text-button" type="button" data-action="finish">先整理共识</button></div>'+(r.round===0&&!answered?c.people.map(p=>speaker(p,p.opening)).join('')+speaker(chair,'你是今天的和事佬。先问一句，了解他们最在意什么。',true):'')+(r.round>0?'<details class="md-history"><summary>前 '+r.round+' 轮对话 <span>＋</span></summary>'+r.turns.slice(0,r.round).map(t=>responses(t)).join('')+'</details>':'')+(answered?responses(r.turns[r.round])+(r.round===2?primary('finish','看看这次谈成了什么'):primary('next',r.round===0?'试着提个方案':'调整方案，再谈一轮')): '<form id="md-conversation">'+(r.round?plan():'<div class="md-suggestions"><button type="button" data-suggestion="你们各自最在意什么？">你们各自最在意什么？ '+icon('arrow')+'</button><button type="button" data-suggestion="先核对哪些事实和记录？">先核对哪些事实和记录？ '+icon('arrow')+'</button></div>')+'<label class="md-label" for="md-message">'+(r.round?'补充一句（可选）':'你想怎么问？')+'</label><div class="md-compose"><textarea id="md-message" rows="2" maxlength="160"'+(busy?' disabled':'')+' placeholder="'+(r.round?'也可以说说这样安排的理由':'写下你的问题，或点选上面的问题')+'">'+esc(r.text)+'</textarea><button class="md-send" type="submit" data-action="send" aria-label="发送发言"'+(busy?' disabled':'')+'>'+icon('arrow')+'</button></div><p class="md-error" id="md-error" aria-live="polite">'+esc(error)+'</p>'+(busy?'<div class="md-thinking" role="status"><i></i> 双方正在回应你的发言…</div>':'')+'</form>')+footer()}
function result(){const r=run(),c=scene(),last=r.turns.filter(t=>t.kind==='proposal').at(-1),choices=last?.choices||[],agreed=choices.filter(i=>i<2),pending=[c.open];if(last?.text)pending.push('你补充发言中的额外要求尚未逐项确认，未记作共识。');return top()+'<section class="md-result-hero"><div>'+icon('people')+'</div><span class="md-eyebrow">这次协调的小结</span><h1 tabindex="-1" data-focus>'+(agreed.length?'有了可以开始的一步':'先把分歧说清楚')+'</h1><p>'+c.title+' · 已对话 '+r.turns.length+' 轮</p></section><section class="md-summary good"><h2>'+icon('check')+' 双方都愿意</h2>'+(agreed.length?'<ul>'+agreed.map(i=>'<li>'+c.options[i].agreement+'</li>').join('')+'</ul>':'<p>还没有形成具体共识。可以保留不同意见，之后再谈。</p>')+'</section><section class="md-summary"><h2>'+icon('chat')+' 仍待继续谈</h2><ul>'+pending.map(t=>'<li>'+t+'</li>').join('')+'</ul></section><section class="md-summary"><h2>'+icon('book')+' 下一步，核对什么</h2><p>'+c.fact+'</p></section><div class="md-takeaway"><span>带走一个协调方法</span><p>'+c.habit+'</p></div><details class="md-law"><summary>'+icon('book')+' 和法律有什么关系？<span>＋</span></summary><p>香港《调解条例》第 4 条所描述的调解，由不偏不倚的人协助找出争议、讨论方案和沟通，不替双方作判决。</p><p>这个练习整理的是虚构角色的协商意愿，并非真实和解协议或责任判定。</p><a href="https://www.doj.gov.hk/sc/legal_dispute/mediation.html" target="_blank" rel="noopener noreferrer">香港律政司 · 调解 '+icon('arrow')+'</a></details><details class="md-history"><summary>回看这次对话 <span>＋</span></summary>'+r.turns.map(t=>responses(t)).join('')+'</details>'+primary('again','换个开场，再协调一次')+'<button class="md-secondary" type="button" data-action="home">换个生活情境</button>'+footer()}
function render(top=false){main.innerHTML=state.view==='generating'&&busy?generating():state.view==='home'?home():state.view==='brief'?brief():state.view==='result'?result():play();root.dataset.view=state.view;root.setAttribute('aria-busy',String(Boolean(busy)));if(top){window.scrollTo({top:0,behavior:'instant'});main.querySelector('[data-focus]')?.focus({preventScroll:true})}}
function stop(){token++;timers.forEach(clearTimeout);timers=[];busy=null;if(state.view==='generating')state.view='home'}
function generate(topic){if(busy)return;topic=clean(topic).trim();const id=match(topic);state.draft=topic;if(!id){error=topic?'先试试「维修改期」或「邻里空间」，这两个情境已准备好。':'先选一个情境，或写下你想协调的事。';save();render();return}error='';const t=++token;busy={kind:'generation',step:0,topic};state.view='generating';save();render(true);timers=[setTimeout(()=>{if(t!==token)return;busy.step=1;render()},550),setTimeout(()=>{if(t!==token)return;busy.step=2;render()},1150),setTimeout(()=>{if(t!==token)return;state.run={caseId:id,topic,round:0,turns:[],choices:[],text:''};state.view='brief';busy=null;timers=[];save();render(true)},1750)]}
function send(){if(busy||state.view!=='play'||run().turns.length>run().round)return;const r=run(),text=clean(r.text).trim();if(!text&&!r.choices.length){error=r.round?'选一个方案，或写下你的想法。':'先写一句想问的话。';render();return}error='';const turn={text,kind:r.round?'proposal':kind(text),choices:r.round?[...r.choices]:[]},t=++token;busy={kind:'reply'};render();timers=[setTimeout(()=>{if(t!==token)return;r.turns.push(turn);r.text='';busy=null;timers=[];save();render();main.querySelector('.md-responses:last-of-type')?.scrollIntoView({block:'start',behavior:'smooth'})},650)]}
root.addEventListener('input',e=>{if(e.target.id==='md-topic'){state.draft=clean(e.target.value);main.querySelectorAll('[data-case]').forEach(card=>card.setAttribute('aria-pressed',String(match(state.draft)===card.dataset.case)))}if(e.target.id==='md-message'&&run())run().text=clean(e.target.value);error='';const el=main.querySelector('#md-error');if(el)el.textContent='';save()});
root.addEventListener('change',e=>{if(e.target.matches('[data-option]')&&run()&&!busy){const i=Number(e.target.dataset.option);if(!Number.isInteger(i)||i<0||i>2)return;run().choices=e.target.checked?validChoices([...run().choices,i]):run().choices.filter(n=>n!==i);e.target.closest('label').classList.toggle('selected',e.target.checked);save()}});
root.addEventListener('submit',e=>{if(e.target.id==='md-generator'){e.preventDefault();generate(state.draft)}if(e.target.id==='md-conversation'){e.preventDefault();send()}});
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!root.contains(b)||b.disabled)return;const a=b.dataset.action;if(a==='home'||a==='cancel'){stop();state.view='home';error='';save();render(true);return}if(busy)return;if(b.dataset.case&&CASES[b.dataset.case]){state.draft=CASES[b.dataset.case].prompt;error='';save();render();main.querySelector('#md-topic')?.focus();return}if(b.dataset.suggestion&&run()){run().text=b.dataset.suggestion;save();send();return}if(a==='begin'&&run()){state.view='play';save();render(true)}if(a==='resume'&&run()){state.view=run().turns.length===3?'result':'play';save();render(true)}if(a==='next'&&state.view==='play'&&run().round<2&&run().turns.length>run().round){run().round++;run().text='';save();render(true)}if(a==='finish'&&run()){state.view='result';save();render(true)}if(a==='again'&&run())generate(run().topic)});
window.addEventListener('pagehide',()=>{stop();save()});window.addEventListener('pageshow',e=>{if(e.persisted)render()});
render();
})();
</script>

<script>(()=>{
