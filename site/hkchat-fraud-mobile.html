<script>/* Offline story generator. The same topic and seed always rebuild the same case. */
(function (root) {
  'use strict';

  function hash(value) {
    let h = 2166136261;
    for (let i = 0; i < value.length; i++) h = Math.imul(h ^ value.charCodeAt(i), 16777619);
    return h >>> 0;
  }

  function random(seed) {
    let state = seed >>> 0;
    return function () {
      state += 0x6D2B79F5;
      let n = state;
      n = Math.imul(n ^ (n >>> 15), n | 1);
      n ^= n + Math.imul(n ^ (n >>> 7), n | 61);
      return ((n ^ (n >>> 14)) >>> 0) / 4294967296;
    };
  }

  function generate(input, inputSeed) {
    const topic = String(input == null ? '' : input).replace(/\s+/g, ' ').trim().slice(0, 120) || '周末的一次服务预约';
    const seed = String(inputSeed == null ? 0 : inputSeed);
    const rand = random(hash(topic + '\u0000' + seed));
    const pick = values => values[Math.floor(rand() * values.length)];
    const shuffle = values => {
      const out = values.slice();
      for (let i = out.length - 1; i > 0; i--) {
        const j = Math.floor(rand() * (i + 1));
        [out[i], out[j]] = [out[j], out[i]];
      }
      return out;
    };
    const profiles = [
      { match: /租房|租屋|租约|租客|房东|押金|公寓/, service: '看房与交接预约', extra: '交接清洁服务', reason: '房源方未能按约开放房间', coordinator: '租住协调员', messenger: '预约联络员', keeper: '房源记录员', place: '房源交接记录' },
      { key: 'bank', match: /银行|銀行|转账|轉賬|贷款|账户|存款|理财/, service: '银行客户服务预约', extra: '纸本回单寄送服务', reason: '预约服务方未能提供约定安排', coordinator: '客户服务负责人', messenger: '业务联络员', keeper: '服务记录员', place: '服务申请与变更日志' },
      { key: 'marriage', match: /婚|伴侣|恋爱|储蓄|彩礼|夫妻/, service: '婚前共同预算安排', extra: '额外婚礼布置项目', reason: '共同计划的发起方取消了原安排', coordinator: '共同预算经办人', messenger: '婚事联络员', keeper: '预算记录员', place: '共同预算支出与变更记录' },
      { match: /健身|运动|瑜伽|游泳|课程|教练/, service: '健身体验与课程预约', extra: '训练记录整理服务', reason: '场馆未能提供约定的体验课程', coordinator: '课程负责人', messenger: '课程联络员', keeper: '场馆记录员', place: '课程排期原始记录' },
      { match: /宠物|寵物|寄养|猫|狗/, service: '宠物寄养预约', extra: '寄养记录整理服务', reason: '寄养方未能提供约定的独立房间', coordinator: '寄养负责人', messenger: '寄养联络员', keeper: '照护记录员', place: '寄养房间安排记录' },

    ];
    const domainProfiles = [
      { key: 'student', match: /留港|留学|留學|学生|學生|校园|校園|入学|入學|学费|學費|录取|錄取|学校|學校|院校|大学|大學/, organization: '晴屿学院', service: '新生报到资料代办', extra: '新生资料快递服务', reason: '校方取消了该次报到安排', coordinator: '新生缴费经办人', messenger: '迎新联络员', keeper: '校务记录员', place: '晴屿学院缴费原页与校务日志' },
      { key: 'health', match: /保健|养生|養生|康养|康養|健康套餐/, organization: '青禾养生中心', service: '养生体验课', extra: '体验记录册整理服务', reason: '门店取消了该次体验课', coordinator: '养生中心结算负责人', messenger: '体验课联络员', keeper: '门店记录员', place: '青禾养生中心订单原页与服务日志' },

    const profile = domainProfiles.find(p => p.key === domainKey) || domainProfiles.find(p => p.match.test(topic)) || profiles.find(p => specific && p.key === specific) || profiles.find(p => p.match.test(topic)) || { service: '专题委托预约', extra: '委托明细整理服务', reason: '受托方未能提供约定的预约安排', coordinator: '委托协调员', messenger: '委托联络员', keeper: '履约记录员', place: '委托预约原始记录' };

    const cash = value => 'HK$' + value.toLocaleString('en-US');
    const money = cash(amount), charge = cash(fee);
    const subject = '「' + topic + '」';
    const names = shuffle(['林澈', '叶宁', '周岚', '许遥', '陈予', '苏禾', '何简', '沈知']).slice(0, 3);

        title: '被省略的后半句', subtitle: '一句“不退”，真的涵盖所有情况吗？', stakeLabel: '待退预约款', stakeValue: money,
        intro: '你为' + subject + '安排了' + profile.service + '，支付' + money + '。预约当天，服务方取消安排，退款却迟迟没有下文。三位经手人都说自己按流程办事。',
        original: subject + '预约约定第4条：委托人自行取消，预约款不退。第5条：服务方无法提供约定安排，委托人可选择全额退款或自愿改期。本单预约款共' + money + '。',

function resumeCard(){return state.hasCase?'<button class="d-resume" data-action="resume">'+icon('play')+'<span><strong>'+(state.stage===5?'回看上一局':state.stage===0?'查看这局':'继续这局')+'</strong><small>'+esc(CASE.title)+' · '+(state.stage===5?'已揭晓':state.stage===4?'等待判断':state.stage===0?'准备开始':'第 '+state.round+' 轮')+'</small></span>'+icon('arrow-right')+'</button>':'';}
function customTopicForm(domain){
 const examples=domain?.topics||['校园缴费通知','保健套餐重复扣费','保险理赔代办授权'];
 return '<form id="d-custom-form" class="d-custom"><div class="d-sectionhead"><h2>'+icon('sparkles')+'自定义防骗话题</h2></div><label for="d-topic" class="d-small">'+(domain?'在「'+esc(domain.label)+'」里，你想练习哪种情况？':'写下你遇到的场景，开始一局推理。')+'</label><textarea id="d-topic" name="topic" rows="2" maxlength="120" placeholder="'+esc(domain?.placeholder||'例如：有人冒充学校，要求缴纳保证金')+'" required>'+esc(state.hubTopic)+'</textarea><div class="d-topic-examples">'+examples.map(t=>'<button type="button" data-topic="'+esc(t)+'">'+esc(t)+'</button>').join('')+'</div><p class="d-error" id="d-topic-error" role="alert"></p><button type="submit" class="d-primary d-full" id="d-generate">生成一局 '+icon('arrow-right')+'</button></form>';
}
function mission(){return '<div class="d-mission"><span>'+icon('messages-square')+'最多 5 轮</span><span>'+icon('files')+'自由追问</span><span>'+icon('scan-search')+'随时判断</span></div><p class="d-footnote">虚构案件 · 每局约 5 分钟</p>';}
function hub(){
 return '<div class="d-hero d-hub-hero"><span class="d-overline">HKChat · 防诈防骗演练</span><h1>醒目防騙</h1><p>从熟悉的生活领域，练习识破可疑话术。</p></div>'+resumeCard()+'<div class="d-sectionhead"><h2>先选一个防骗领域</h2><button class="d-link" data-action="random-domain">'+icon('shuffle')+'随机选</button></div><div class="d-domain-grid">'+DOMAINS.map(domain=>'<button class="d-domain" data-domain="'+domain.id+'"><span class="d-domain-photo" aria-hidden="true"><img src="'+DOMAIN_PHOTOS[domain.id]+'" width="640" height="480" alt="" decoding="async"></span><span class="d-domain-icon '+domain.id+'">'+icon(domain.icon)+'</span><strong>'+esc(domain.label)+'</strong><small>'+esc(domain.description)+'</small><span class="d-domain-go">'+domain.cases.length+' 个场景 '+icon('arrow-up-right')+'</span></button>').join('')+'</div>'+customTopicForm()+mission();
}
function domainPage(){
 const domain=findDomain(state.domain);
 return '<button class="d-link d-back" data-action="home">'+icon('arrow-left')+'所有领域</button><div class="d-domain-heading"><span class="d-domain-icon '+domain.id+'">'+icon(domain.icon)+'</span><div><span class="d-overline">醒目防騙</span><h1>'+esc(domain.label)+'</h1><p>'+esc(domain.description)+'</p></div></div>'+((state.hasCase&&state.caseDomain===domain.id)?resumeCard():'')+'<div class="d-sectionhead"><h2>选择一个场景</h2><button class="d-link" data-action="random">'+icon('shuffle')+'随机一局</button></div><div class="d-domain-scenes">'+domain.cases.map(({key})=>{const c=CASES[key];return '<button class="d-scene d-domain-scene" data-case="'+key+'"><div><strong>'+esc(c.title)+'</strong><small>'+esc(c.subtitle)+'</small><span class="d-scene-go">进入场景 '+icon('arrow-up-right')+'</span></div><span class="d-scenario-number">'+String(domain.cases.findIndex(item=>item.key===key)+1).padStart(2,'0')+'</span></button>';}).join('')+'</div>'+customTopicForm(domain)+mission();
}

function avatar(p){return '<span class="d-avatar tone-'+CASE.suspects.findIndex(x=>x.id===p.id)+'" aria-hidden="true">'+esc(p.name[0])+'</span>'}
function speech(id,text,compact=false){const p=person(id);return '<article class="d-speech'+(compact?' compact':'')+'"><div class="d-speaker">'+avatar(p)+'<div><strong>'+esc(p.name)+'</strong><small>'+esc(p.role)+'</small></div></div><p>'+esc(text)+'</p></article>'}
function targets(){return '<div class="d-targets" aria-label="选择对话对象">'+CASE.suspects.map(p=>'<button class="d-target" data-target="'+p.id+'" aria-pressed="'+(state.target===p.id)+'">'+esc(p.name)+'</button>').join('')+'</div>'}
function button(action,label,primary=true,disabled=false){return '<button class="'+(primary?'d-primary':'d-secondary')+' d-full" data-action="'+action+'"'+(disabled?' disabled':'')+'>'+label+'</button>'}
function stepHeader(){return '<div class="d-topline"><strong>醒目防騙</strong><span class="d-case-name">'+esc(CASE.title)+'</span></div>';}
function dossier(){return '<div class="d-evidence-grid">'+CASE.evidence.map(e=>{const read=state.read.includes(e.id);return '<button class="d-evidence-card'+(read?' read':'')+'" data-evidence="'+e.id+'"><span class="d-evhead">'+e.id+icon(read?'check':'file-text')+'</span><strong>'+esc(e.title)+'</strong><small>'+(read?'已阅 · 再次查看':'打开原始记录')+'</small></button>';}).join('')+'</div>';}
function archive(){return '<details id="d-records"><summary>查看相关记录 '+icon('chevron-down')+'</summary>'+dossier()+'</details>';}

function intro(){return '<div class="d-hero"><h1>'+esc(CASE.title)+'</h1><p>'+esc(CASE.subtitle)+'</p></div><section class="d-ticket"><span class="d-overline">'+esc(CASE.kicker.replace(/三轮推理/g,'对话调查'))+'</span><h2>这一次，谁在用话术误导你？</h2><p>'+esc(CASE.intro)+'</p><div class="d-ticket-bottom"><span>'+esc(CASE.stakeLabel)+'</span><strong>'+esc(CASE.stakeValue)+'</strong></div></section><div class="d-cast">'+CASE.suspects.map(p=>'<div class="d-cast-card">'+avatar(p)+'<strong>'+esc(p.name)+'</strong><small>'+esc(p.role)+'</small></div>').join('')+'</div>'+button('start','进入调查 '+icon('arrow-right'))+(state.caseKey==='custom'?'<button class="d-link d-full" data-action="reroll">'+icon('shuffle')+'换一个剧情</button>':'')+'<div class="d-mission"><span>'+icon('messages-square')+'最多 5 轮</span><span>'+icon('scan-search')+'自由追问</span><span>'+icon('user-round-search')+'随时判断</span></div><p class="d-footnote">虚构案件 · 约 5 分钟</p>'}
function conversationQuestions(suspectId,round=state.round){
 const level=round<=2?1:round===5?3:2;
 const available=CASE.questions.filter(q=>q.suspectId===suspectId&&q.round<=level);
 const primary=available.find(q=>q.round===level);
 const secondary=level===3?available.find(q=>q.round===2):question(suspectId+'-extra');
 return [primary,secondary,...available].filter((q,i,all)=>q&&all.findIndex(item=>item?.id===q.id)===i).slice(0,2);
}
function cleanFollowup(value){return String(value??'').replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\u007f]/g,'').slice(0,500);}
function normalizedQuestion(text){return text.replace(/[\s，。！？,.!?]/g,'');}
function replyIdFor(suspectId,text,round){const choices=conversationQuestions(suspectId,round);return (choices.find(q=>normalizedQuestion(q.question)===normalizedQuestion(text))||choices[0]).id;}
function roundWasAsked(round){return state.interviews.some(entry=>entry.round===round);}
function restoreInterviews(saved,next){
 next.questionDrafts={};
 for(const p of CASE.suspects)if(typeof saved.questionDrafts?.[p.id]==='string')next.questionDrafts[p.id]=cleanFollowup(saved.questionDrafts[p.id]);
 next.interviews=[];
 for(const entry of Array.isArray(saved.interviews)?saved.interviews:[]){
  if(!entry||typeof entry!=='object')continue;
  const round=saved.version>=3&&Number.isInteger(entry.round)&&entry.round>=1&&entry.round<=5?entry.round:1;
  if(entry.kind==='preset'&&question(entry.questionId)&&!next.interviews.some(x=>x.kind==='preset'&&x.questionId===entry.questionId&&x.round===round)){
   next.interviews.push({kind:'preset',questionId:entry.questionId,round});
   if(!next.asked.includes(entry.questionId))next.asked.push(entry.questionId);
  }
  if(entry.kind==='custom'&&person(entry.suspectId)&&typeof entry.text==='string'){
   const text=cleanFollowup(entry.text).trim();if(!text)continue;
   next.interviews.push({kind:'custom',suspectId:entry.suspectId,text,round,replyId:replyIdFor(entry.suspectId,text,round)});
  }
 }
 for(const id of next.asked)if(!next.interviews.some(x=>x.kind==='preset'&&x.questionId===id))next.interviews.push({kind:'preset',questionId:id,round:1});
}
function interviewHTML(entry){
 const q=question(entry.kind==='preset'?entry.questionId:entry.replyId),text=entry.kind==='preset'?q.question:entry.text;
 return '<div class="d-interview-entry"><div class="d-player d-interview-player"><small>你向 '+esc(person(q.suspectId).name)+' 追问</small>'+esc(text)+'</div>'+speech(q.suspectId,q.response)+'</div>';
}
function followupForm(p){
 const draft=state.questionDrafts[p.id]||'';
 return '<form id="d-question-form" class="d-followup"><label for="d-question-input">也可以自己问 '+esc(p.name)+'</label><textarea id="d-question-input" name="question" rows="3" maxlength="500" placeholder="输入你想问的问题…">'+esc(draft)+'</textarea><div class="d-followup-actions"><button class="d-primary" type="submit" id="d-question-send" '+(draft.trim()?'':'disabled')+'>发送追问 '+icon('send')+'</button></div></form>';
}
function afterInterview(){
 notice=person(state.target).name+'已回应。';save();render();
 root.querySelector('#d-interview-log .d-interview-entry:last-child')?.scrollIntoView({block:'nearest',behavior:'instant'});
}
function submitFollowup(){
 if(state.screen!=='case'||state.stage!==1||roundWasAsked(state.round))return;
 const input=root.querySelector('#d-question-input'),text=cleanFollowup(input.value).trim();if(!text)return;
 state.interviews.push({kind:'custom',suspectId:state.target,text,round:state.round,replyId:replyIdFor(state.target,text,state.round)});
 state.questionDrafts[state.target]='';afterInterview();
}


function exchangeInfo(x){const entry=CASE.cross.find(row=>row.target===x.target&&row.requires.every(id=>x.pair.includes(id)));return entry||{ask:'请解释这两份记录。',text:'请继续核对原始记录。',follow:[],host:'还需要补充证据。'};}
function exchangeHTML(x){const info=exchangeInfo(x);return '<div class="d-player"><small>你向'+esc(person(x.target).name)+'出示了 '+x.pair.join(' + ')+'</small>'+esc(info.ask)+'</div>'+speech(x.target,info.text)+info.follow.map(([id,t])=>speech(id,t,true)).join('')+'<div class="d-note"><strong>本次对质</strong>'+esc(info.host)+'</div>'}
const MAX_ROUNDS=5;
function dialogueFor(round){
 return CASE.suspects.map(p=>{
  const level=round<=2?1:round===5?3:2;
  const q=CASE.questions.find(q=>q.suspectId===p.id&&q.round===level);
  const cross=round===3?CASE.debate.find(item=>item.round===2&&item.speakerId===p.id):null;
  return speech(p.id,round===1?p.opening:cross?.text||q?.response||p.opening);
 }).join('');
}
function conversation(){
 const done=roundWasAsked(state.round);
 const history=state.round>1?'<details id="d-talk-history"><summary>回看之前的对话 '+icon('chevron-down')+'</summary>'+Array.from({length:state.round-1},(_,i)=>'<section class="d-past-round"><h3>第 '+(i+1)+' 轮</h3>'+dialogueFor(i+1)+state.interviews.filter(entry=>entry.round===i+1).map(interviewHTML).join('')+'</section>').join('')+'</details>':'';
 return '<div class="d-talk-toolbar" id="d-talk-toolbar"><span>第 '+state.round+' / '+MAX_ROUNDS+' 轮对话</span><button class="d-primary" data-action="accuse" type="button">我有判断了 '+icon('arrow-right')+'</button></div><div class="d-round-transcript">'+dialogueFor(state.round)+'</div><div id="d-interview-log" aria-live="polite" aria-relevant="additions">'+state.interviews.filter(entry=>entry.round===state.round).map(interviewHTML).join('')+'</div>'+(done?'<p class="d-talk-done">本轮追问已完成。'+(state.round===MAX_ROUNDS?'可以做出你的判断了。':'可以继续下一轮，或做出判断。')+'</p>':'<div class="d-sectionhead"><h3>这轮想问谁？</h3></div>'+targets()+'<section class="d-question-prompts" aria-labelledby="d-question-prompts-title"><div class="d-question-prompts-heading"><h3 id="d-question-prompts-title">可以这样问</h3><span>点选即可追问</span></div>'+conversationQuestions(state.target).map(q=>'<button class="d-question" data-question="'+q.id+'" type="button"><span>'+esc(q.question)+'</span>'+icon('arrow-up-right')+'</button>').join('')+'</section>'+followupForm(person(state.target)))+'<div class="d-actions d-round-actions">'+(state.round>1?button('prev-round',icon('arrow-left')+'上一轮',false):'')+(state.round<MAX_ROUNDS?button('next-round','下一轮对话 '+icon('arrow-right')):'<p class="d-round-limit">最多 5 轮，已到最后一轮。</p>')+'</div>'+history+(state.exchanges.length?'<details><summary>已保存的调查记录 '+icon('chevron-down')+'</summary>'+state.exchanges.map(exchangeHTML).join('')+'</details>':'')+archive()+hintUI();
}
function accusation(){
 return '<span class="d-overline">你的判断</span><h2 style="margin-top:7px">你觉得谁有骗人风险？</h2><p class="d-introline">选出你认为最值得警惕的一位。</p>'+CASE.suspects.map(p=>'<label class="d-accuse-option">'+avatar(p)+'<span><strong>'+esc(p.name)+'</strong><small>'+esc(p.role)+'</small></span><input type="radio" name="culprit" value="'+p.id+'"'+(state.accused===p.id?' checked':'')+' aria-label="选择'+esc(p.name)+'"></label>').join('')+'<div class="d-actions">'+button('reveal','确认判断 · 查看解析',true,!state.accused)+'</div><button class="d-link d-full" data-action="back" type="button">'+icon('arrow-left')+'再聊聊，暂不判断</button>';
}
function result(){
 const correct=state.accused===CASE.final.culpritId;
 const feedback=correct?'你注意到了本局的关键误导风险。结合前后的说法，可以看清问题出在哪里。':'你选择了'+person(state.accused).name+'。TA的说法有疑点，但完整记录支持了另一种解释。';
 return '<div class="d-result-banner"><span class="d-overline">本局风险解析</span><br>'+avatar(person(CASE.final.culpritId))+'<h2>'+esc(person(CASE.final.culpritId).name)+' · '+esc(person(CASE.final.culpritId).role)+'</h2><p>'+esc(CASE.final.headline)+'</p></div><div class="d-note"><strong>你的判断'+(correct?' · 抓住了关键':' · 再看一条线索')+'</strong>'+esc(feedback)+'</div><details class="d-result-reasoning"><summary>为什么是 TA？'+icon('chevron-down')+'</summary><ol class="d-chain">'+CASE.final.chain.map(({id,title,text})=>'<li><span class="d-dot">'+esc(id)+'</span><div><strong>'+esc(title)+'</strong><p>'+esc(text)+'</p></div></li>').join('')+'</ol></details><details><summary>另外两人的说法如何理解？'+icon('chevron-down')+'</summary>'+CASE.final.innocentExplanations.map(x=>'<section class="d-why"><div class="d-speaker">'+avatar(person(x.suspectId))+'<div><strong>'+esc(person(x.suspectId).name)+'</strong><small>'+x.evidenceIds.join(' + ')+'</small></div></div><p>'+esc(x.text)+'</p></section>').join('')+'</details><div class="d-note"><strong>带走一个防骗方法</strong>'+esc(CASE.final.takeaway)+'</div>'+archive()+'<div class="d-actions">'+button('back','继续调查 '+icon('messages-square'))+button('case-scenes','换个场景 '+icon('arrow-right'),false)+'</div><button class="d-link d-full" data-action="reset" type="button">重玩这局 '+icon('rotate-ccw')+'</button><p class="d-footnote">本局结论依据虚构记录。</p>';
}

function hintUI(){const hints=CASE.hints;return '<div class="d-sectionhead" style="margin-bottom:0"><button class="d-link" data-action="hint"'+(state.hints>=3?' disabled':'')+'>'+icon('lightbulb')+(state.hints>=3?'提示已看完':state.hints?'再给一点提示':'给我一点提示')+'</button><span class="d-small">'+state.hints+'/3</span></div>'+(state.hints?'<div class="d-note">'+hints[state.hints-1]+'</div>':'')}
function render(scroll=false){root.dataset.view=state.screen==='case'&&state.stage===1?'conversation':'other';root.querySelector('#d-hero-placeholder').hidden=true;content.innerHTML=state.screen==='hub'?hub():state.screen==='domain'?domainPage():('<button class="d-link d-back" data-action="case-scenes">'+icon('arrow-left')+(findDomain(state.caseDomain)?esc(findDomain(state.caseDomain).label):'所有领域')+'</button>'+(state.stage===1?stepHeader():'')+(state.stage===0?intro():state.stage===1?conversation():state.stage===4?accusation():result()));root.querySelector('#d-status').textContent=notice;window.lucide?.createIcons({attrs:{width:18,height:18}});updateControls();if(scroll)window.scrollTo({top:0,behavior:'instant'});}
function updateControls(){const reveal=root.querySelector('[data-action=reveal]');if(reveal)reveal.disabled=!person(state.accused);}
function openFile(id){
 if(!file(id))return;lastFile=id;const e=file(id);
 if(!state.read.includes(id)){state.read.push(id);save();root.querySelectorAll('[data-evidence="'+id+'"]').forEach(card=>{card.classList.add('read');card.querySelector('small').textContent='已阅 · 再次查看';});}
 dialog.innerHTML='<div class="d-dialog-head"><span class="d-overline">记录 '+id+'</span><button class="d-close" data-action="close-dialog" aria-label="关闭记录">'+icon('x')+'</button></div><h2 id="d-dialog-title">'+esc(e.title)+'</h2><p class="d-doc-body">'+esc(e.body)+'</p><p class="d-doc-source">'+esc(e.source)+'</p><div class="d-dialog-actions">'+button('close-dialog','看完了 '+icon('check'))+'</div>';window.lucide?.createIcons({attrs:{width:18,height:18}});dialog.showModal();
}
root.addEventListener('click',ev=>{
 const b=ev.target.closest('button');if(!b||b.disabled)return;
 if(b.dataset.domain){showDomain(b.dataset.domain);return;}
 if(b.dataset.case){loadCase(b.dataset.case);return;}
 if(b.dataset.topic){state.hubTopic=b.dataset.topic;const field=root.querySelector('#d-topic');field.value=state.hubTopic;field.focus();save();return;}
 if(b.dataset.evidence){openFile(b.dataset.evidence);return;}
 if(b.dataset.target){if(state.stage!==1||roundWasAsked(state.round))return;state.target=b.dataset.target;notice='';save();render();root.querySelector('[data-target="'+state.target+'"]').focus({preventScroll:true});return;}
 if(b.dataset.question){const id=b.dataset.question;if(state.screen==='case'&&state.stage===1&&!roundWasAsked(state.round)&&conversationQuestions(state.target).some(q=>q.id===id)){if(!state.asked.includes(id))state.asked.push(id);state.interviews.push({kind:'preset',questionId:id,round:state.round});afterInterview();}return;}
 const a=b.dataset.action;if(!a)return;notice='';
 if(a==='close-dialog'){dialog.close();return;}
 if(a==='home'){home();return;}
 if(a==='case-scenes'){caseScenes();return;}
 if(a==='resume'){state.domain=state.caseDomain;state.screen='case';save();render(true);return;}
 if(a==='random-domain'){showDomain(DOMAINS[randomSeed()%DOMAINS.length].id);return;}
 if(a==='random'){const domain=findDomain(state.domain);if(!domain)return;const alternatives=domain.cases.filter(entry=>!state.hasCase||entry.key!==state.caseKey);const entries=alternatives.length?alternatives:domain.cases;loadCase(entries[randomSeed()%entries.length].key);return;}
 if(a==='reroll'){loadCase('custom',state.topic,(state.seed+1+randomSeed()%1000000)>>>0,state.caseDomain);return;}
 if(a==='reset'){loadCase(state.caseKey,state.topic,state.seed,state.caseDomain);return;}
 if(a==='start'){state.stage=1;state.round=1;}
 else if(a==='next-round'){if(state.stage!==1||state.round>=MAX_ROUNDS)return;state.round++;}
 else if(a==='prev-round'){if(state.stage!==1||state.round<=1)return;state.round--;}
 else if(a==='accuse'){if(state.stage!==1)return;state.stage=4;}
 else if(a==='back'){if(state.stage!==4&&state.stage!==5)return;state.stage=1;}
 else if(a==='reveal'){if(state.stage!==4||!person(state.accused))return;state.stage=5;}
 else if(a==='hint')state.hints=Math.min(3,state.hints+1);
 else return;
 save();render(a!=='hint');
});
root.addEventListener('input',ev=>{if(ev.target.id==='d-question-input'&&state.screen==='case'&&state.stage===1&&!roundWasAsked(state.round)){state.questionDrafts[state.target]=cleanFollowup(ev.target.value);root.querySelector('#d-question-send').disabled=!state.questionDrafts[state.target].trim();save();return;}if(ev.target.id==='d-topic'){state.hubTopic=ev.target.value.slice(0,120);root.querySelector('#d-topic-error').textContent='';save();}});
root.addEventListener('submit',ev=>{if(ev.target.id==='d-question-form'){ev.preventDefault();submitFollowup();return;}if(ev.target.id!=='d-custom-form')return;ev.preventDefault();const field=root.querySelector('#d-topic'),topic=cleanTopic(field.value);if(topic.length<2){root.querySelector('#d-topic-error').textContent='写下至少两个字，让案件有个起点。';field.focus();return;}state.hubTopic=topic;const domain=state.screen==='domain'?findDomain(state.domain):null;const scopedTopic=domain?cleanTopic(domain.label+'：'+topic):topic;loadCase('custom',scopedTopic,randomSeed(),domain?.id||'');});
root.addEventListener('change',ev=>{const input=ev.target;if(input.name==='culprit'&&state.stage===4&&person(input.value)){state.accused=input.value;save();updateControls();}});
dialog.addEventListener('click',ev=>{if(ev.target===dialog){const r=dialog.getBoundingClientRect();if(ev.clientX<r.left||ev.clientX>r.right||ev.clientY<r.top||ev.clientY>r.bottom)dialog.close();}});
dialog.addEventListener('close',()=>{root.querySelector('[data-evidence="'+lastFile+'"]')?.focus({preventScroll:true});});
render();
})();
</script>
