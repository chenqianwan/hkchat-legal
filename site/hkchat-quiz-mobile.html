#hkquiz *{box-sizing:border-box}#hkquiz [hidden]{display:none!important}#hkquiz button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;color:inherit}#hkquiz button:disabled{cursor:default}#hkquiz button,#hkquiz summary,#hkquiz a{outline-offset:4px}#hkquiz :is(button,summary,a):focus-visible{outline:3px solid var(--p-primary)}#hkquiz [tabindex='-1']:focus{outline:none}#hkquiz :is(h1,h2,h3,p){margin:0}#hkquiz .q-icon{width:21px;height:21px;flex-shrink:0;display:block}#hkquiz .q-main{padding:22px 18px max(28px,env(safe-area-inset-bottom));overflow-wrap:anywhere}

<script>(() => {
 'use strict';
 window.HKQuizDuel=function({root,main,stories,icon,esc,source,modeTabs,onSolo}){
  const labels={work:{title:'打工日常',sub:'合約・出糧・扣薪',icon:'work'},daily:{title:'消費約定',sub:'落單・講價・送貨',icon:'book'},online:{title:'網上私隱',sub:'相片・群組・資料',icon:'online'}};
  const available=stories.filter(s=>Array.isArray(s.questions)&&s.questions.length>=5);
  let topic=available[0]?.id||'work',serial=0,epoch=0,timers=new Set();
  let state=blank();
  function blank(){return {view:'lobby',questions:[],opponentAnswers:[],answers:[],round:0,opponentReady:false,revealed:false,revealScheduled:false};}
  function live(){return String(root.dataset.view||'').startsWith('pk-');}
  function stop(){epoch++;timers.forEach(clearTimeout);timers.clear();state=blank();}
  function later(fn,delay){const version=epoch,id=setTimeout(()=>{timers.delete(id);if(version!==epoch||!live())return;fn();},delay);timers.add(id);}
  function shuffle(items,seed){const next=items.slice();let x=seed>>>0;for(let i=next.length-1;i>0;i--){x=(Math.imul(x,1664525)+1013904223)>>>0;const j=x%(i+1);[next[i],next[j]]=[next[j],next[i]];}return next;}
  const selectedStory=()=>available.find(s=>s.id===topic)||available[0];
  const question=()=>state.questions[state.round];
  const scores=()=>{const visible=state.view==='result'?5:state.round+(state.revealed?1:0);let you=0,opponent=0;for(let i=0;i<visible;i++){if(state.answers[i]===state.questions[i].q.correct)you+=100;if(state.opponentAnswers[i]===state.questions[i].q.correct)opponent+=100;}return {you,opponent};};
  const tag=()=>'<p class="qd-demo">'+icon('spark')+'<span>對戰演示 · 對手由程式模擬</span></p>';
  function lobby(){return '<section class="qd-hero"><div class="qd-versus-art" aria-hidden="true"><span>你</span><b>'+icon('spark')+'</b><span>晴</span></div><h1 tabindex="-1" data-focus>線上 PK</h1><p>同一題，睇下邊個識多啲。</p></section>'+modeTabs()+tag()+'<section class="qd-lobby-panel"><h2>揀個話題，開始對戰</h2><div class="qd-topics" role="group" aria-label="對戰話題">'+available.map(s=>{const l=labels[s.id]||{title:s.title,sub:'生活法律',icon:'book'};return '<button type="button" data-duel-topic="'+esc(s.id)+'" aria-pressed="'+(topic===s.id)+'">'+icon(l.icon)+'<strong>'+esc(l.title)+'</strong><small>'+esc(l.sub)+'</small></button>';}).join('')+'</div><div class="qd-rules"><span>5 題</span><span>答啱 +100</span><span>不比速度</span></div><button type="button" class="qd-primary" data-duel-action="match">開始配對演示'+icon('arrow')+'</button></section><p class="qd-footnote">雙方同題、同分，答錯不扣分。</p>';}
  function matching(){return modeTabs()+'<button type="button" class="qd-back" data-duel-action="cancel">'+icon('back')+'取消配對</button><section class="qd-matching"><div class="qd-versus-art qd-is-searching" aria-hidden="true"><span>你</span><b>'+icon('spark')+'</b><span>晴</span></div><h1 tabindex="-1" data-focus>準備對戰中…</h1><p>'+esc((labels[topic]||{}).title||selectedStory().title)+' · 同題 5 局</p><div class="qd-match-status" role="status"><i class="qd-spinner" aria-hidden="true"></i>正在準備五道題與演示對手</div>'+tag()+'</section>';}
  function scorebar(){const s=scores();return '<div class="qd-scoreboard" aria-label="你 '+s.you+' 分，演示對手阿晴 '+s.opponent+' 分"><div class="qd-player"><span class="qd-avatar">你</span><div><strong>你</strong><b data-duel-score="you">'+s.you+'</b></div></div><span class="qd-vs">VS</span><div class="qd-player qd-opponent"><div><strong>阿晴 <small>模擬</small></strong><b data-duel-score="opponent">'+s.opponent+'</b></div><span class="qd-avatar">晴</span></div></div>';}
  function roundView(){const entry=question(),q=entry.q,answer=state.answers[state.round],hasAnswer=Number.isInteger(answer),revealed=state.revealed;
   return modeTabs()+'<div class="qd-round-top"><button type="button" class="qd-back" data-duel-action="cancel">'+icon('back')+'離開對戰</button><span>'+esc((labels[topic]||{}).title||selectedStory().title)+' · '+(state.round+1)+' / 5</span></div>'+scorebar()+'<div class="qd-round-progress" aria-label="第 '+(state.round+1)+' 題，共5題">'+state.questions.map((_,i)=>'<span class="'+(i<state.round?'done':i===state.round?'current':'')+'"></span>').join('')+'</div><div class="qd-submit-status" aria-live="polite"><span>'+icon(hasAnswer?'check':'book')+(hasAnswer?'你已鎖定答案':'等你作答')+'</span><span>'+icon(state.opponentReady?'check':'spark')+(state.opponentReady?'阿晴已作答':'阿晴作答中')+' <small>演示</small></span></div><section class="qd-scenario"><div><span>'+esc(q.scene)+'</span><small>'+esc(q.speaker)+'</small></div><p>'+esc(q.statement)+'</p></section><h1 class="qd-question" tabindex="-1" data-focus>'+esc(q.question)+'</h1><div class="qd-options" role="group" aria-label="選一個答案">'+entry.order.map((a,i)=>{
    const correct=revealed&&a===q.correct,chosen=answer===a,opponentPicked=revealed&&state.opponentAnswers[state.round]===a;
    return '<button type="button" class="qd-option'+(correct?' is-correct':revealed&&chosen?' is-missed':chosen?' is-locked':'')+'" data-duel-answer="'+a+'" aria-pressed="'+chosen+'"'+(hasAnswer?' disabled':'')+'><span class="qd-option-letter">'+(correct?icon('check'):['A','B','C'][i])+'</span><span class="qd-option-copy">'+esc(q.options[a])+((chosen||opponentPicked)?'<small>'+(chosen?'你選的':'')+(chosen&&opponentPicked?' · ':'')+(opponentPicked?'阿晴選的':'')+'</small>':'')+'</span></button>';
   }).join('')+'</div>'+(revealed?roundResult(q):hasAnswer?'<div class="qd-waiting" role="status"><i class="qd-spinner" aria-hidden="true"></i><span>答案已鎖定，等雙方準備好一齊揭曉。</span></div>':'<p class="qd-footnote">想清楚再揀，答啱 +100，答錯 0 分。</p>')+'<p class="qd-footnote qd-small-demo">對戰演示 · 阿晴由程式模擬</p>';
  }
  function roundResult(q){const mine=state.answers[state.round]===q.correct,theirs=state.opponentAnswers[state.round]===q.correct;return '<section class="qd-reveal" aria-labelledby="qd-reveal-heading"><div class="qd-reveal-heading"><span>'+icon(mine?'check':'bulb')+'</span><h2 id="qd-reveal-heading" tabindex="-1">'+(mine?'答啱了！':'記低呢個法律重點')+'</h2></div><div class="qd-round-scores"><span>你 <b>+'+(mine?100:0)+'</b></span><span>阿晴 <small>模擬</small> <b>+'+(theirs?100:0)+'</b></span></div><p class="qd-correct-answer">答案：'+esc(q.options[q.correct])+'</p><p class="qd-explanation">'+esc(q.explanation)+'</p><p class="qd-takeaway">'+icon('book')+esc(q.takeaway)+'</p><details class="qd-source"><summary>睇法律依據</summary><p>'+esc(q.legalLabel)+'</p>'+source(q)+'</details></section><button type="button" class="qd-primary" data-duel-action="next">'+(state.round===4?'睇對戰結果':'下一題')+icon('arrow')+'</button>';}
  function result(){const s=scores(),outcome=s.you>s.opponent?'win':s.you===s.opponent?'draw':'loss',title=outcome==='win'?'今局你贏！':outcome==='draw'?'打成平手！':'今局阿晴領先',caption=outcome==='win'?'連知識都一齊贏返嚟。':outcome==='draw'?'各有心得，下局再分高下。':'睇返法律重點，下局再試。';return modeTabs()+'<section class="qd-result-hero" data-duel-result="'+outcome+'"><span class="qd-result-mark">'+icon(outcome==='win'?'star':outcome==='draw'?'repeat':'book')+'</span><h1 tabindex="-1" data-focus>'+title+'</h1><p>'+caption+'</p></section>'+scorebar()+'<div class="qd-final-caption"><span>你答啱 '+s.you/100+' / 5</span><span>阿晴答啱 '+s.opponent/100+' / 5 · 模擬</span></div>'+tag()+'<div class="qd-review-heading"><h2>今局五個法律重點</h2><span>點開重溫</span></div><div class="qd-review">'+state.questions.map(({q},i)=>{const good=state.answers[i]===q.correct;return '<details class="qd-review-card" data-duel-review="'+i+'"><summary><span class="qd-review-number '+(good?'is-correct':'')+'">'+(good?icon('check'):i+1)+'</span><span>'+esc(q.takeaway)+'<small>'+(good?'你答啱了':'可以再記一下')+'</small></span><b aria-hidden="true">＋</b></summary><div class="qd-review-copy"><p class="qd-review-question">'+esc(q.question)+'</p><p>你揀：'+esc(q.options[state.answers[i]])+'</p><p>阿晴揀：'+esc(q.options[state.opponentAnswers[i]])+' <small>模擬</small></p><p class="qd-correct-answer">答案：'+esc(q.options[q.correct])+'</p><p>'+esc(q.explanation)+'</p><p class="qd-review-law">'+esc(q.legalLabel)+'</p>'+source(q)+'</div></details>';}).join('')+'</div><button type="button" class="qd-primary" data-duel-action="again">再來一局'+icon('repeat')+'</button><button type="button" class="qd-secondary" data-duel-action="topics">換個話題</button><button type="button" class="qd-text-button" data-duel-action="solo">返回單人闖關</button><p class="qd-footnote">同題同分 · 不比速度 · 一般法律教育</p>';}
  function render(top=false,focus){
   const active=document.activeElement,keepTopic=active?.dataset?.duelTopic,keepAnswer=active?.dataset?.duelAnswer;
   root.dataset.view=state.view==='lobby'?'pk-lobby':state.view==='matching'?'pk-matching':state.view==='result'?'pk-result':state.revealed?'pk-reveal':Number.isInteger(state.answers[state.round])?'pk-waiting':'pk-round';
   root.setAttribute('aria-busy',String(state.view==='matching'||root.dataset.view==='pk-waiting'));
   main.innerHTML=state.view==='lobby'?lobby():state.view==='matching'?matching():state.view==='result'?result():roundView();
   if(top)window.scrollTo({top:0,behavior:'instant'});
   const target=focus?main.querySelector(focus):keepTopic?main.querySelector('[data-duel-topic="'+keepTopic+'"]'):keepAnswer!==undefined?main.querySelector('[data-duel-answer="'+keepAnswer+'"]:not(:disabled)'):null;
   if(target){target.focus({preventScroll:true});if(!top&&focus)target.scrollIntoView({block:'nearest',behavior:'auto'});}
  }
  function begin(){if(!['lobby','result'].includes(state.view)||!selectedStory())return;stop();serial++;const s=selectedStory();const entries=s.questions.slice(0,5).map((base,i)=>{const q=serial%2===0&&base.twist?base.twist:base;return {q,order:shuffle(q.options.map((_,n)=>n),serial*107+i*19+3)};});
   const correctCount=serial%2===1?3:4,wrong=new Set(shuffle([0,1,2,3,4],serial*23+19).slice(correctCount));
   state={...blank(),view:'matching',questions:entries,opponentAnswers:entries.map(({q},i)=>wrong.has(i)?(q.correct+1+(i%2))%q.options.length:q.correct)};
   render(true,'[data-focus]');later(()=>{state.view='round';render(true,'[data-focus]');prepareOpponent();},1500);
  }
  function prepareOpponent(){state.opponentReady=false;state.revealed=false;state.revealScheduled=false;later(()=>{if(state.view!=='round'||state.revealed)return;state.opponentReady=true;if(Number.isInteger(state.answers[state.round]))revealSoon();else render();},650+(state.round*173+serial*97)%650);}
  function revealSoon(){if(state.revealScheduled||state.revealed||!state.opponentReady||!Number.isInteger(state.answers[state.round]))return;state.revealScheduled=true;render();later(()=>{if(state.view!=='round'||state.revealed)return;state.revealed=true;state.revealScheduled=false;render(false,'#qd-reveal-heading');},360);}
  function answer(value){if(state.view!=='round'||state.revealed||Number.isInteger(state.answers[state.round]))return;const q=question().q;if(!Number.isInteger(value)||value<0||value>=q.options.length)return;state.answers.push(value);render();if(state.opponentReady)revealSoon();}
  function next(){if(state.view!=='round'||!state.revealed)return;if(state.round===4){state.view='result';render(true,'[data-focus]');return;}state.round++;state.revealed=false;state.opponentReady=false;state.revealScheduled=false;render(true,'[data-focus]');prepareOpponent();}
  root.addEventListener('click',e=>{if(!live())return;const button=e.target.closest('button');if(!button||!root.contains(button)||button.disabled)return;
   if(button.dataset.duelTopic&&state.view==='lobby'){if(!available.some(s=>s.id===button.dataset.duelTopic))return;topic=button.dataset.duelTopic;render();return;}
   if(button.dataset.duelAnswer!==undefined){answer(Number(button.dataset.duelAnswer));return;}
   const action=button.dataset.duelAction;if(action==='cancel'||action==='topics'){stop();render(true,'[data-focus]');return;}
   if(action==='match'||action==='again'){begin();return;}if(action==='next'){next();return;}if(action==='solo'){stop();onSolo();}
  });
  return {render,stop};
 };
})();

(()=>{'use strict';

const STORIES=[{"id": "work", "title": "入职第一天", "aliases": ["工作", "上班", "入职", "老板", "打工", "工资", "兼职", "劳动", "雇佣", "扣薪", "迟到", "发薪"], "intro": "你加入一家虚构的香港小店。从入职签约走到第一次发薪，几条看似平常的消息，藏着不同的法律条件。", "setting": "晴湾小店 · 香港 · 虚构情境", "questions": [{"id": "work-waiver", "scene": "09:00 · 入职签约", "speaker": "人事同事", "statement": "欢迎加入晴湾小店。这一条写着：员工自愿放弃本来适用的《雇佣条例》法定权益，签名便生效。", "question": "你会怎样理解这条约定？", "options": ["签名后，法定保障就可取消", "减少条例赋予的保障，这类条款无效", "有见证人在场就有效"], "correct": 1, "explanation": "合约不能以员工签名取消或减少条例原本给予他的保障。题中说的正是适用的法定权益。", "takeaway": "先分清法定保障与额外福利。", "legalLabel": "《雇佣条例》· 雇佣合约", "sourceLabel": "劳工处：雇佣合约常见问题", "sourceUrl": "https://www.labour.gov.hk/chs/faq/cap57b_whole.htm", "twist": {"changed": "改成尚未获承诺的额外福利", "id": "work-waiver-twist", "scene": "09:00 · 入职签约", "speaker": "人事同事", "statement": "修改一下：公司从未承诺免费员工午餐，这次合约也没有提供；你的法定权益一项都没减少。", "question": "能仅凭「不得减少法定权益」断定这份合约无效吗？", "options": ["能，所有福利都必须提供", "能，员工不喜欢就无效", "不能，这里没有减少题设的法定权益"], "correct": 2, "explanation": "这次没有取消条例给予的权利。不能把未获承诺的额外午餐，直接当成法定福利；已有的其他约定另当别论。", "takeaway": "同一条规则，要看保护的是什么。", "legalLabel": "《雇佣条例》· 雇佣合约", "sourceLabel": "劳工处：雇佣合约常见问题", "sourceUrl": "https://www.labour.gov.hk/chs/faq/cap57b_whole.htm"}}, {"id": "work-copy", "scene": "09:30 · 合约签完了", "speaker": "人事同事", "statement": "这份书面雇佣合约你已经签了。文件只留公司，员工不发副本。", "question": "公司应怎样处理？", "options": ["给你一份合约副本保存", "只让你当场看一眼就够了", "等离职才可以给副本"], "correct": 0, "explanation": "书面雇佣合约须向雇员提供副本。读过或签过，都不能代替取得副本。", "takeaway": "自己的雇佣合约，要留一份。", "legalLabel": "《雇佣条例》· 雇佣合约", "sourceLabel": "劳工处：雇佣合约常见问题", "sourceUrl": "https://www.labour.gov.hk/chs/faq/cap57b_whole.htm", "twist": {"changed": "改为口头订约、入职前已书面索取", "id": "work-copy-twist", "scene": "09:30 · 确认聘用条件", "speaker": "新同事", "statement": "这次我们只口头订约，没有签书面合约；我已在开始受雇前书面要求取得聘用条件。", "question": "这时公司须提供什么？", "options": ["必须补造一份双方从未签过的合约", "载明聘用条件的通知书", "口头约定，所以什么也不用给"], "correct": 1, "explanation": "没有书面合约，不存在那份已签文件的副本。但雇主在雇佣开始前收到书面要求，须提供载明聘用条件的通知书。", "takeaway": "没有书面合约，也有取得条件记录的途径。", "legalLabel": "《雇佣条例》· 雇佣合约", "sourceLabel": "劳工处：雇佣合约常见问题", "sourceUrl": "https://www.labour.gov.hk/chs/faq/cap57b_whole.htm"}}, {"id": "work-late", "scene": "10:00 · 第一张考勤记录", "speaker": "主管", "statement": "你只迟到十分钟。今天照常工作其余时间，但我会按缺勤扣你半天基本工资。", "question": "只看缺勤扣薪，这样计算可以吗？", "options": ["可以，迟到就能任意处罚", "不可以，扣款须与缺勤时间成比例", "只要墙上贴过通知就可以"], "correct": 1, "explanation": "因缺勤扣工资，只能按实际缺勤时间的比例计算。十分钟不能直接变为半天。", "takeaway": "核对扣款对应的实际缺勤。", "legalLabel": "《雇佣条例》· 工资保障", "sourceLabel": "劳工处：工资常见问题", "sourceUrl": "https://www.labour.gov.hk/chs/faq/cap57c_whole.htm", "twist": {"changed": "实际无薪缺勤改为完整半天", "id": "work-late-twist", "scene": "10:00 · 考勤记录更正", "speaker": "主管", "statement": "记录更正：你今天确实无薪缺勤完整半天，其他时间正常上班。这项扣款只按那半天的比例计算。", "question": "只就这项缺勤扣薪，哪句最准确？", "options": ["缺勤扣薪也一律禁止", "每次缺勤最多只能扣十分钟", "与实际半天缺勤成比例，符合这项限制"], "correct": 2, "explanation": "改变的是实际缺勤时长。条例容许按缺勤比例扣款；题中不是把短暂迟到放大成罚款。", "takeaway": "金额相同，事实不同，判断会变。", "legalLabel": "《雇佣条例》· 工资保障", "sourceLabel": "劳工处：工资常见问题", "sourceUrl": "https://www.labour.gov.hk/chs/faq/cap57c_whole.htm"}}, {"id": "work-pay", "scene": "一个月后 · 第一次发薪", "speaker": "老板", "statement": "这个工资期结束九天了，到期工资仍未支付。只是财务忙，继续等吧。", "question": "只看工资期届满后的最迟期限，情况怎样？", "options": ["已超过一般七天支付上限", "还没超过，公司有三十天", "没有任何法定时间限制"], "correct": 0, "explanation": "到期工资须尽快支付，而且一般不得迟于工资期结束后七天。财务忙不能自行延长上限。", "takeaway": "工资期结束后的七天是最迟上限。", "legalLabel": "《雇佣条例》· 工资保障", "sourceLabel": "劳工处：工资常见问题", "sourceUrl": "https://www.labour.gov.hk/chs/faq/cap57c_whole.htm", "twist": {"changed": "改为届满后第二天、约定今日支付", "id": "work-pay-twist", "scene": "一个月后 · 第一次发薪", "speaker": "老板", "statement": "这个工资期结束两天，合约约定今天发薪，目前还在处理。你问：是不是已经超过法定七天上限？", "question": "只根据题中的时间，怎么回答？", "options": ["已经超过七天", "尚未超过，但仍须尽快及按约支付", "没超过，所以必定能拖到第七天"], "correct": 1, "explanation": "两天没有超过七天上限。上限并不是任意延后约定发薪日的许可，也不能忽略尽快支付的要求。", "takeaway": "没超过上限，不代表可以随意拖延。", "legalLabel": "《雇佣条例》· 工资保障", "sourceLabel": "劳工处：工资常见问题", "sourceUrl": "https://www.labour.gov.hk/chs/faq/cap57c_whole.htm"}}, {"id": "work-parttime", "scene": "发薪当天 · 新同事来问", "speaker": "兼职同事", "statement": "我确实是按雇佣合约受聘的雇员，但每周只上几个小时。老板说兼职不受工资扣除限制。", "question": "「兼职」标签会取消这项保障吗？", "options": ["会，只有全职才受保障", "会，工时少就没有扣薪限制", "不会，受条例保障的雇员也享有扣薪限制"], "correct": 2, "explanation": "工资支付及扣除等保障，不是只有全职雇员才有。额外权益是否适用须分别看条件，不能混为一谈。", "takeaway": "先看法律关系，再看具体权益。", "legalLabel": "《雇佣条例》· 雇佣合约", "sourceLabel": "劳工处：雇佣合约常见问题", "sourceUrl": "https://www.labour.gov.hk/chs/faq/cap57b_whole.htm", "twist": {"changed": "改为真正独立经营的服务商", "id": "work-parttime-twist", "scene": "发薪当天 · 另一份合作", "speaker": "合作伙伴", "statement": "这次不是雇员。双方事实也确认我是独立经营的服务商，自负经营风险；讨论的是服务费，并非雇佣工资。", "question": "可以直接把雇员工资扣除规则套进来吗？", "options": ["不能直接套用，应核对服务合约及其他适用规则", "可以，所有收款的人都是雇员", "没有雇佣关系，便完全没有法律保障"], "correct": 0, "explanation": "《雇佣条例》下这些保障针对雇佣关系。真实身份不能只凭标签判断；本题已明确独立服务关系，服务费争议要看相应合约。", "takeaway": "不同法律关系，适用规则不同。", "legalLabel": "《雇佣条例》· 雇佣合约", "sourceLabel": "劳工处：雇佣合约常见问题", "sourceUrl": "https://www.labour.gov.hk/chs/faq/cap57b_whole.htm"}}]}, {"id": "daily", "title": "网购那张书桌", "aliases": ["网购", "购物", "消费", "买东西", "卖东西", "合约", "合同", "订单", "报价", "运费", "送货", "订购", "付款", "书桌"], "intro": "你想在一家虚构网店买张书桌。从第一句报价到送货改期，看看一句回复会改变什么。", "setting": "晴湾生活店 · 香港 · 虚构情境", "questions": [{"id": "daily-display", "scene": "第一幕 · 逛网上小店", "speaker": "朋友", "statement": "晴湾小店网页陈列了一张500元书桌，没有写点击就自动成交，也还没有人处理你的订单。", "question": "单看这页普通商品陈列，最接近什么？", "options": ["店铺已经向每位浏览者成交", "邀请顾客提出购买要约", "浏览网页就已接受合约"], "correct": 1, "explanation": "普通商品陈列通常是在邀请购买者提出要约，不等于每个浏览者都已经取得成交承诺。线上还要结合页面及下单条款。", "takeaway": "看到标价，不等于已订立合约。", "legalLabel": "普通法 · 合约的成立", "sourceLabel": "香港大学社区法网：何为合约", "sourceUrl": "https://www.clic.org.hk/zh/topics/consumer_complaints/consumer_contracts/q1", "twist": {"changed": "改成店主向你发送具体成交承诺", "id": "daily-display-twist", "scene": "第一幕 · 店主发来私信", "speaker": "店主", "statement": "我现在明确向你提出：这张现货书桌500元，明天送到你指定地址，包运费；你回复接受全部条款就成交。", "question": "这则明确对你发出的承诺最接近什么？", "options": ["仍然只是所有网页都一样的陈列", "你已经接受了它", "店主向你提出具体要约"], "correct": 2, "explanation": "这里不再只是展示商品，而是店主明确表达愿按具体条件成交。你是否接受，是下一步需要确认的事实。", "takeaway": "要看 险，不等于已证明犯罪。", "legalLabel": "《个人资料（私隐）条例》· 第64(3A)条", "sourceLabel": "私隐专员公署：起底罪行", "sourceUrl": "https://www.pcpd.org.hk/tc_chi/doxxing/index.html", "twist": {"changed": "改为已明确意图让对方遭滋扰", "id": "online-doxxing-twist", "scene": "第四幕 · 新消息出现", "speaker": "群友", "statement": "这次已知有人未获相关同意披露住址，并明确说要让对方遭到滋扰；暂未有人实际去骚扰，他因此说「绝对没有刑事风险」。", "question": "只因暂未发生实际滋扰，就能排除第一层级起底风险吗？", "options": ["不能，该层级并不要求实际伤害已经发生", "能，所有起底罪都必须先有实际伤害", "能，没有很多人看就没有风险"], "correct": 0, "explanation": "题中新增了与同意和意图有关的事实。第一层级不以实际指明伤害已经发生为必要条件；是否构成罪行仍须依法查证全部要件和适用抗辩。", "takeaway": "「还没造成伤害」并非一概免除风险。", "legalLabel": "《个人资料（私隐）条例》· 第64(3A)条", "sourceLabel": "私隐专员公署：起底罪行", "sourceUrl": "https://www.pcpd.org.hk/tc_chi/doxxing/index.html"}}, {"id": "online-access", "scene": "第五幕 · 查自己的活动记录", "speaker": "参加者", "statement": "我已向活动公司正式要求查阅自己的报名资料，身份核验完成，也没有收费或豁免争议。收到要求已过41个历日，公司从未回复。", "question": "只看一般处理时限，哪个判断最准确？", "options": ["公司只须每年处理一次", "已经超过通常40个历日的期限", "回一句收到就算提供了资料"], "correct": 1, "explanation": "查阅要求一般须在40个历日内依从。确实不能如期完全依从时，也须按规定书面说明并尽快完成；题中一直没有回复。", "takeaway": "查自己的资料，有程序也有时间要求。", "legalLabel": "《个人资料（私隐）条例》· 查阅资料要求", "sourceLabel": "私隐专员公署：处理查阅资料要求指引", "sourceUrl": "https://www.pcpd.org.hk/tc_chi/publications/files/DAR_c.pdf", "twist": {"changed": "改成收到要求仅10个历日", "id": "online-access-twist", "scene": "第五幕 · 看清收件日期", "speaker": "参加者", "statement": "同样的正式查阅要求，其实公司才收到10个历日，仍在准备副本，没有收费或豁免争议。", "question": "只凭这10天，能说已超过一般40日上限吗？", "options": ["能，所有要求必须当天完成", "能，10日等于40个工作日", "不能，但公司仍须依从适用的查阅规定"], "correct": 2, "explanation": "这次改变了经过的时间。10个历日尚未超过40个历日；时间没超，不代表公司可以不处理或用一句确认收件代替资料副本。", "takeaway": "看清是历日，也看清收到要求的日期。", "legalLabel": "《个人资料（私隐）条例》· 查阅资料要求", "sourceLabel": "私隐专员公署：处理查阅资料要求指引", "sourceUrl": "https://www.pcpd.org.hk/tc_chi/publications/files/DAR_c.pdf"}}]}],root=document.getElementById('hkquiz'),main=root.querySelector('#q-main'),KEY='hkchat-law-quiz-generated-v1';

 (history.length?'<div class="q-section-head"><h2>为你生成过</h2><span>'+history.length+' 局</span></div><div class="q-history">'+history.map(r=>'<button type="button" data-session="'+r.id+'"><span class="q-history-icon">'+icon(r.complete?'check':'book')+'</span><span><strong>'+esc(r.topic)+'</strong><small>'+esc(story(r).title)+' · '+(r.complete?'完成 · '+score(r)+' / 5':'第 '+(r.index+1)+' / 5 关')+'</small></span>'+icon('chevron')+'</button>').join('')+'</div>':'')+'<p class="q-footnote">情境生成演示 · 香港法律知识</p>';
}
function generating(){const b=busy,s=STORIES.find(s=>s.id===b.storyId),labels=['正在理解你的话题','正在编排生活情境','正在整理五关挑战'];return '<button class="q-back" type="button" data-action="cancel">'+icon('back')+' 返回</button><section class="q-generating" aria-busy="true"><div class="q-generation-orbit">'+icon('spark')+'</div><span class="q-eyebrow">正在为你出题</span><h1 tabindex="-1" data-focus>'+esc(b.topic)+'</h1><p>'+esc(s.intro)+'</p><ol class="q-generation-steps" aria-live="polite">'+labels.map((label,i)=>'<li class="'+(i<b.step?'done':i===b.step?'active':'')+'"><span>'+(i<b.step?icon('check'):i===b.step?'<i class="q-spinner"></i>':i+1)+'</span>'+label+'</li>').join('')+'</ol><div class="q-generation-preview"><span>'+esc(s.title)+'</span><p>'+esc(s.questions[Math.min(b.step,4)].scene)+'</p><div class="q-generation-bar"><i style="width:'+([26,63,92][b.step])+'%"></i></div></div></section>'}
function brief(){const r=run(),s=story(r);return '<button class="q-back" type="button" data-action="home">'+icon('back')+' 换个话题</button><section class="q-brief-hero" data-brief-theme="'+esc(s.id)+'"><img class="q-brief-photo" src="'+esc(BRIEF_PHOTOS[s.id])+'" alt="" aria-hidden="true" decoding="async"><span class="q-brief-credit">AI 生成場景</span><div class="q-brief-copy"><span class="q-generated-tag">你的专属挑战已就绪</span><h1 tabindex="-1" data-focus>'+esc(r.topic)+'</h1><p>'+esc(s.intro)+'</p></div></section><div class="q-coach">'+icon('spark')+'<p>'+(r.tailored?'这局优先复习你上次没掌握的规则，再用不同条件继续考你。':'我准备了 5 个生活判断。你答完后，我会按掌握情况调整后面的关卡。')+'</p></div><ol class="q-plan">'+r.steps.map((key,i)=>{const q=catalog.get(key);return '<li><span>'+String(i+1).padStart(2,'0')+'</span><div><strong>'+esc(q.scene)+'</strong><small>'+esc(q.legalLabel)+'</small></div></li>'}).join('')+'</ol><button class="q-primary" type="button" data-action="begin">进入我的挑战 '+icon('arrow')+'</button><button class="q-text-button" type="button" data-action="regenerate">'+icon('repeat')+' 换一组情境</button>'}
function feedback(q,answer){const good=answer===q.correct;return '<section class="q-feedback'+(good?' correct':' missed')+'" aria-labelledby="q-feedback-heading"><div class="q-feedback-heading" role="status"><span>'+icon(good?'check':'bulb')+'</span><h3 id="q-feedback-heading" tabindex="-1">'+(good?'答对了！':'关键条件在这里')+'</h3>'+(good?'<b>＋1</b>':'')+'</div><p class="q-answer-label">正确答案：'+esc(q.options[q.correct])+'</p><p class="q-explanation">'+esc(q.explanation)+'</p><div class="q-rule">'+icon('book')+'<span>'+esc(q.takeaway)+'</span></div><details class="q-basis"><summary>查看法律依据</summary><p>'+esc(q.legalLabel)+'</p>'+source(q)+'</details></section>'}
function coachNote(r,q){if(q.isTwist&&r.index>0&&catalog.get(r.steps[r.index-1]).baseKey===q.baseKey){const prev=catalog.get(r.steps[r.index-1]),missed=r.answers[r.index-1]!==prev.correct;return '<div class="q-coach q-branch-note">'+icon('spark')+'<p><strong>'+(missed?'换个条件，巩固刚才的规则':'应你的挑战，条件变了')+'</strong>'+esc(q.changed)+'</p></div>'}return '<div class="q-coach q-brief-coach">'+icon('spark')+'<p>'+(r.index===0?'从这个场景开始，看看你会怎样判断。':'继续你的话题，看看另一个法律细节。')+'</p></div>'}
function play(){
 const r=run(),s=story(r),q=current(),answered=r.answers.length>r.index,answer=r.answers[r.index],canTwist=!q.isTwist&&catalog.has(q.baseKey+'~twist')&&r.index<4;
 const adaptive=answered&&answer!==q.correct&&canTwist;
 return '<div class="q-play-top"><button class="q-back" type="button" data-action="home" aria-label="返回生成入口">'+icon('back')+' 我的挑战</button><span class="q-score">'+icon('star')+' '+score(r)+'</span></div><div class="q-session-topic">'+icon('spark')+'<span>'+esc(r.topic)+'</span></div><div class="q-progress-header"><span>第 <strong>'+(r.index+1)+'</strong> / 5 关</span><span>'+esc(q.scene)+'</span></div><ol class="q-progress" aria-label="关卡进度">'+r.steps.map((key,i)=>'<li class="'+(i<r.answers.length?(r.answers[i]===catalog.get(key).correct?'right':'wrong'):i===r.index?'current':'')+'"'+(i===r.index?' aria-current="step"':'')+' aria-label="第 '+(i+1)+' 关"><span>'+(i<r.answers.length?icon(r.answers[i]===catalog.get(key).correct?'check':'bulb'):i+1)+'</span></li>').join('')+'</ol>'+coachNote(r,q)+
 '<section class="q-scenario"><div class="q-speaker"><span class="q-avatar">'+icon(s.id==='work'?'work':s.id==='online'?'online':'book')+'</span><span>'+esc(q.speaker)+'</span><small>情境卡</small></div><p>「'+esc(q.statement)+'」</p></section><h2 class="q-question" tabindex="-1" data-focus>'+esc(q.question)+'</h2><p class="q-pick-label">选一个最合适的答案</p><div class="q-options" role="group" aria-label="答案选项">'+order(r.seed+r.index,3).map((i,pos)=>{
 const mark=answered?(i===q.correct?' right':i===answer?' wrong':' muted'):'';
 return '<button class="q-option'+mark+'" type="button" data-answer="'+i+'" aria-pressed="'+(answered&&i===answer)+'"'+(answered?' disabled':'')+'><span class="q-option-letter">'+(answered&&i===q.correct?icon('check'):answered&&i===answer?icon('cross'):['A','B','C'][pos])+'</span><span>'+esc(q.options[i])+'</span>'+(answered&&i===answer?'<small>你选的</small>':'')+'</button>';
 }).join('')+'</div>'+(answered?feedback(q,answer)+(busy?.kind==='next'?'<div class="q-next-loading" role="status" aria-live="polite"><i class="q-spinner"></i>'+esc(busy.message)+'</div>':
 (r.index<4?'<div class="q-next-coach"><span>'+icon('spark')+'</span><p>'+(adaptive?'刚才的规则值得再练一下。下一关我换个条件，你再判断一次。':'这一关已完成，继续生成下一个场景。')+'</p></div>':'')+'<button class="q-primary" type="button" data-action="next">'+(r.index===4?'查看我的学习小结':'AI 生成下一关')+' '+icon(r.index===4?'arrow':'spark')+'</button>'+(canTwist&&!adaptive?'<button class="q-secondary" type="button" data-action="twist">'+icon('repeat')+' 换个条件再考我</button>':'')):'<p class="q-gentle">不用赶时间，想好再选。</p>');
}
function result(){
 const r=run(),n=score(r),missed=r.steps.filter((key,i)=>r.answers[i]!==catalog.get(key).correct),weak=[...new Set(missed.map(k=>catalog.get(k).takeaway))];
 return '<button class="q-back" type="button" data-action="home">'+icon('back')+' 生成入口</button><section class="q-result-hero"><div class="q-trophy" aria-hidden="true">'+icon(n===5?'star':'spark')+'</div><span class="q-eyebrow">你的学习小结</span><h1 tabindex="-1" data-focus>'+(n===5?'五关全对，漂亮！':n>=3?'又多懂了一点法律':'把这几条规则带回生活')+'</h1><p class="q-result-topic">'+esc(r.topic)+'</p><div class="q-result-score"><strong>'+n+'</strong><span>/ 5</span></div><div class="q-result-dots" aria-label="'+n+' 题答对">'+r.steps.map((key,i)=>'<span class="'+(r.answers[i]===catalog.get(key).correct?'right':'wrong')+'">'+icon(r.answers[i]===catalog.get(key).correct?'check':'bulb')+'</span>').join('')+'</div></section><section class="q-personal-summary"><div>'+icon('spark')+'<strong>'+(weak.length?'下次，我会重点考你':'下次，可以换个条件挑战')+'</strong></div><p>'+(weak.length?weak.map(esc).join(' '):'这局的判断都答对了。再换一组条件，看看你能否识别规则的边界。')+'</p></section><div class="q-section-head"><h2>这局的五个判断</h2><span>点开回看</span></div><div class="q-review">'+r.steps.map((key,i)=>{
 const q=catalog.get(key),good=r.answers[i]===q.correct;
 return '<details class="q-review-card" data-review="'+i+'"><summary><span class="q-review-state '+(good?'right':'wrong')+'">'+icon(good?'check':'bulb')+'</span><span>'+esc(q.takeaway)+'<small>'+(good?'已掌握':'再记一下')+(q.isTwist?' · 条件变化':'')+'</small></span><b aria-hidden="true">＋</b></summary><div class="q-review-copy"><p class="q-review-question">'+esc(q.question)+'</p><p>你选了：'+esc(q.options[r.answers[i]])+'</p><p class="q-review-answer">正确答案：'+esc(q.options[q.correct])+'</p><p>'+esc(q.explanation)+'</p><p class="q-review-law">'+esc(q.legalLabel)+'</p>'+source(q)+'</div></details>';
 }).join('')+'</div><button class="q-primary" type="button" data-action="personalize">'+icon('spark')+' '+(weak.length?'根据我的错题，再出一局':'换一组条件，再出一局')+'</button><button class="q-secondary" type="button" data-action="home">换个话题 '+icon('arrow')+'</button><p class="q-footnote">情境生成演示 · 法律答案以本关事实与适用条件为准</p>';
}
function render(top=false,focus){if(mode==='pk'){duel.render(top,focus);return;}main.innerHTML=state.view==='generating'&&busy?generating():state.view==='home'?home():state.view==='brief'?brief():state.view==='result'?result():play();root.dataset.view=state.view;root.setAttribute('aria-busy',String(Boolean(busy)));if(top)window.scrollTo({top:0,behavior:'instant'});if(focus){const el=main.querySelector(focus);el?.focus({preventScroll:true});if(!top)el?.scrollIntoView({block:'nearest',behavior:'auto'})}}
function stop(){token++;timers.forEach(clearTimeout);timers=[];busy=null;if(state.view==='generating')state.view='home'}
function generate(topic,priority=[],forceStory){
 if(busy)return;topic=safeTopic(topic);const s=forceStory?STORIES.find(s=>s.id===forceStory):matchTopic(topic);state.draft=topic;
 if(!topic||!s){error=topic?'这个话题暂未准备好。当前演示支持打工、消费约定和网上私隐，试试上面的示例。':'先写一个生活话题，或点选上面的示例。';state.view='home';save();render(false,'#q-topic');return;}
 error='';const previous=state.sessions.filter(r=>r.storyId===s.id).at(-1),seed=(Math.floor(Math.random()*4294967296))>>>0;const t=++token;
 busy={kind:'session',step:0,topic,storyId:s.id};state.view='generating';save();render(true,'[data-focus]');
 timers=[setTimeout(()=>{if(t!==token)return;busy.step=1;render()},650),setTimeout(()=>{if(t!==token)return;busy.step=2;render()},1300),setTimeout(()=>{
  if(t!==token)return;
  const preferred=[...new Set(priority)].filter(k=>catalog.get(k)?.storyId===s.id).map(k=>catalog.get(k).baseKey);
  const ordered=[...new Set([...preferred,...s.questions.map(q=>s.id+'/'+q.id)])];
  let steps=ordered.map((key,i)=>{
   if(!catalog.has(key+'~twist'))return key;
   const prev=previous?.steps.filter(k=>catalog.get(k).baseKey===key).at(-1);
   if(priority.length&&preferred.includes(key)){const failed=priority.filter(k=>catalog.get(k).baseKey===key).at(-1);return failed.endsWith('~twist')?key:key+'~twist';}
   return prev?(prev.endsWith('~twist')?key:key+'~twist'):i%2===1?key+'~twist':key;
  }).slice(0,5);
  const id='round-'+(++state.counter),r={id,storyId:s.id,topic,seed,steps,answers:[],index:0,complete:false,tailored:priority.length>0};
  state.sessions.push(r);state.sessions=state.sessions.slice(-12);state.active=id;state.view='brief';busy=null;timers=[];save();render(true,'[data-focus]');
 },2050)];
}
function advance(forceTwist=false){
 if(busy||state.view!=='play')return;const r=run(),q=current();if(r.answers.length!==r.index+1)return;
 if(r.index===4){r.complete=true;state.view='result';save();render(true,'[data-focus]');return;}
 const twist=!q.isTwist&&catalog.has(q.baseKey+'~twist')&&(forceTwist||r.answers[r.index]!==q.correct),t=++token;
 busy={kind:'next',message:twist?'正在改变关键条件，准备追问…':'正在为你编排下一个场景…'};render(false,'.q-next-loading');
 timers=[setTimeout(()=>{if(t!==token)return;if(twist){r.steps.splice(r.index+1,0,q.baseKey+'~twist');r.steps=r.steps.slice(0,5)}r.index++;busy=null;timers=[];save();render(true,'[data-focus]')},950)];
}
const duel=window.HKQuizDuel({root,main,stories:STORIES,icon,esc,source,modeTabs,onSolo:()=>setMode('solo')});
function setMode(next){if(!['solo','pk'].includes(next))return;stop();duel.stop();mode=next;state.view='home';save();try{history.replaceState(null,'',next==='pk'?'#pk':'#solo')}catch{}render(true,'[data-focus]')}
window.addEventListener('hashchange',()=>{if(location.hash==='#pk'||location.hash==='#solo')setMode(location.hash.slice(1))});
root.addEventListener('input',e=>{if(e.target.id==='q-topic'){state.draft=e.target.value.slice(0,80);error='';const note=main.querySelector('#q-topic-error');if(note)note.textContent='';save()}});
root.addEventListener('submit',e=>{if(e.target.id==='q-generator'){e.preventDefault();generate(main.querySelector('#q-topic').value)}});
root.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b||!root.contains(b)||b.disabled)return;if(b.dataset.quizMode){setMode(b.dataset.quizMode);return;}if(mode==='pk')return;const action=b.dataset.action;
 if(action==='cancel'||action==='home'){stop();state.view='home';save();render(true,'[data-focus]');return;}
 if(busy)return;
 if(b.dataset.topic){state.draft=b.dataset.prompt;error='';save();render(false,'#q-topic');return;}
 if(b.dataset.session){const r=state.sessions.find(r=>r.id===b.dataset.session);if(!r)return;state.active=r.id;state.view=r.complete?'result':'play';save();render(true,'[data-focus]');return;}
 if(b.dataset.answer!==undefined&&state.view==='play'){
  const r=run(),q=current(),a=Number(b.dataset.answer);if(r.answers.length!==r.index||!Number.isInteger(a)||a<0||a>=q.options.length)return;
  r.answers.push(a);save();render(false,'#q-feedback-heading');return;
 }
 if(action==='begin'&&state.view==='brief'){state.view='play';save();render(true,'[data-focus]');return;}
 if(action==='regenerate'&&run()){generate(run().topic,[],run().storyId);return;}
 if(action==='next'){advance(false);return;}if(action==='twist'){advance(true);return;}
 if(action==='personalize'&&state.view==='result'){const r=run(),missed=r.steps.filter((key,i)=>r.answers[i]!==catalog.get(key).correct);generate(r.topic,missed,r.storyId)}
});
window.addEventListener('pagehide',()=>{duel.stop();const pending=busy;stop();if(pending)save()});
window.addEventListener('pageshow',e=>{if(e.persisted)render()});
if(location.hash==='#solo')state.view='home';
render();
})();
