function adCard(c) {
 const key=c.artworkKey||c.id;
 const art=AD_IMAGES[key];
 const lines=c.headline.split(/<br\s*\/?\s*>/i);
 const offer=esc(lines.shift()).replace(/\$[\d,]+/g,price=>'<span class="fp-ad-price">'+price+'</span>');
 const promise=lines.map(esc).join('<br>');
 // Keep longer headlines in the photograph's quiet left-hand copy area.
 const promiseLayout=['gym','wedding','storage','pet','class'].includes(key)?promise.replace('，','，<br>'):promise;
 return '<article class="fp-ad" data-ad="'+esc(key)+'">'+
  (art?'<img class="fp-ad-photo" src="'+art.src+'" alt="'+esc(art.alt)+'" width="960" height="720" decoding="async">':'')+
  '<div class="fp-ad-brand">'+esc(c.brand)+'<span>· '+esc(c.label)+'</span></div>'+
  '<h1 data-focus><span class="fp-ad-offer">'+offer+'</span><span class="fp-ad-promise">'+promiseLayout+'</span></h1>'+
  '<div class="fp-ad-details"><div class="fp-ad-pills">'+c.promises.map(p=>'<span>'+esc(p)+'</span>').join('')+'</div>'+
  '<div class="fp-ad-footer">'+esc(c.receipt)+'</div></div></article>';
}

const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fresh=()=>({version:2,view:'home',caseId:null,selected:[],answer:null,questionOpen:false,completed:[],generated:[]});
function restore(){
 const next=fresh();
 try{
  const saved=JSON.parse(localStorage.getItem(STORAGE)||'null');if(!saved||![1,2].includes(saved.version))return next;
  const seen=new Set();
  if(saved.version===2&&Array.isArray(saved.generated))for(const e of saved.generated){
   if(!e||typeof e.id!=='string'||!/^generated-[1-9]\d*$/.test(e.id)||!Number.isSafeInteger(Number(e.id.slice(10)))||seen.has(e.id)||!TEMPLATE_MAP.has(e.templateId)||!Number.isInteger(e.seed)||e.seed<0||e.seed>4294967295)continue;
   const entry={id:e.id,templateId:e.templateId,seed:e.seed};seen.add(e.id);next.generated.push(entry);CASES.push(makeGenerated(entry));
  }
  next.completed=CASES.filter(c=>Array.isArray(saved.completed)&&saved.completed.includes(c.id)).map(c=>c.id);
  const c=CASES.find(c=>c.id===saved.caseId);if(c){next.caseId=c.id;next.view=['home','challenge','result'].includes(saved.view)?saved.view:'home';next.selected=c.clauses.filter(q=>Array.isArray(saved.selected)&&saved.selected.includes(q.id)).map(q=>q.id);next.answer=c.questions.some(q=>q.id===saved.answer)?saved.answer:null;next.questionOpen=Boolean(saved.questionOpen)}
  return next;
 }catch{return next}
}
let state=restore();
const current=()=>CASES.find(c=>c.id===state.caseId);
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(state))}catch{}}
function go(view){state.view=view;save();render();window.scrollTo({top:0,behavior:'instant'});const heading=main.querySelector('[data-focus]');if(heading){heading.setAttribute('tabindex','-1');heading.focus({preventScroll:true})}}
function start(id){if(!CASES.some(c=>c.id===id))return;state.caseId=id;state.selected=[];state.answer=null;state.questionOpen=false;go('challenge')}
function topline(c){return '<div class="fp-topline"><button class="fp-back" type="button" data-action="home">'+icon('back')+'选择关卡</button><span class="fp-fiction">'+(state.view==='challenge'?'AI 圖像 · 虛構廣告':'虚构演练')+'</span></div>'}
function challenge(c){return topline(c)+adCard(c)+'<h2>哪些细字，值得再问清楚？</h2><p class="fp-instruction">点选与广告承诺有差异、或补充了重要条件的条款。</p><div class="fp-clauses">'+c.clauses.map((q,i)=>'<button type="button" class="fp-clause" data-clause="'+q.id+'" aria-pressed="'+state.selected.includes(q.id)+'"><span class="fp-check">'+icon('check')+'</span><span class="fp-clause-copy"><small>细字 0'+(i+1)+'</small>'+esc(q.text)+'</span></button>').join('')+'</div><details class="fp-question-box" id="fp-questions"'+(state.questionOpen?' open':'')+'><summary>拿不准？问问店员</summary><div class="fp-question-inner"><div class="fp-question-list">'+c.questions.map(q=>'<button type="button" class="fp-question" data-question="'+q.id+'" aria-pressed="'+(state.answer===q.id)+'"><span>'+esc(q.text)+'</span>'+icon('chat')+'</button>').join('')+'</div><div id="fp-reply" aria-live="polite">'+answerHTML(c)+'</div></div></details><div class="fp-action-bar"><p id="fp-selected" class="fp-selected" aria-live="polite">'+selectedText()+'</p><button type="button" class="fp-primary" id="fp-submit" data-action="submit">提交我的发现 '+icon('arrow')+'</button></div>'}
function answerHTML(c){const q=c.questions.find(q=>q.id===state.answer);return q?'<div class="fp-reply"><b>'+esc(c.brand)+' · 店员回复</b>'+esc(q.answer)+'</div>':''}
function selectedText(){return state.selected.length?'已圈出 '+state.selected.length+' 条细字':'也可以直接提交，看看你有没有遗漏'}
function result(c){const risks=c.clauses.filter(q=>q.risk);const found=risks.filter(q=>state.selected.includes(q.id));const extra=c.clauses.filter(q=>!q.risk&&state.selected.includes(q.id));const passed=found.length===risks.length&&extra.length===0;const headline=passed?'细字通关！':found.length===risks.length?'看得仔细，再分清一点':'这次有新发现';const sub=passed?'重要条件全找到了，也分清了正常说明。':found.length===risks.length?'重要条件都找到了，但有些说明不用圈。':'把广告和细字放在一起，条件就清楚了。';return topline(c)+'<section class="fp-result-hero"><div class="fp-result-seal">'+icon(passed?'check':'search')+'</div><div class="fp-eyebrow">'+esc(c.label)+' · 本局发现</div><h1 data-focus>'+headline+'</h1><p>'+sub+'</p><div class="fp-stats"><div class="fp-stat"><strong>'+found.length+'<span style="font-size:16px"> / '+risks.length+'</span></strong><small>重要条件已发现</small></div><div class="fp-stat"><strong>'+extra.length+'</strong><small>正常说明被多选</small></div></div></section><div class="fp-section-title"><h2>广告没说完整的事</h2></div><div class="fp-findings">'+risks.map(q=>'<article class="fp-finding"><div class="fp-finding-head"><h3>'+esc(q.title)+'</h3><span class="fp-result-tag '+(state.selected.includes(q.id)?'':'missed')+'">'+(state.selected.includes(q.id)?'你发现了':'这条漏看了')+'</span></div><div class="fp-contrast"><span>广告说 '+esc(q.promise)+'</span><strong>'+esc(q.actual)+'</strong></div><p>'+esc(q.why)+'</p></article>').join('')+'</div><details class="fp-normal"'+(extra.length?' open':'')+'><summary>另外两条，为什么不用圈？</summary><div class="fp-findings">'+c.clauses.filter(q=>!q.risk).map(q=>'<article class="fp-normal-item"><h3>'+esc(q.title)+(state.selected.includes(q.id)?'<span class="fp-result-tag extra">本次多选</span>':'')+'</h3><p>'+esc(q.why)+'</p></article>').join('')+'</div></details><div class="fp-takeaway"><span>带走一个小习惯</span><p>'+esc(c.takeaway)+'</p></div><div class="fp-result-actions"><button type="button" class="fp-primary" data-action="next">挑战下一关 '+icon('arrow')+'</button><button type="button" class="fp-secondary" data-action="retry">再试这关</button></div><button type="button" class="fp-plain-link" data-action="home">回到全部关卡</button><p class="fp-small-note">本局比较广告与条款文字，不评价真实条款是否合法。</p>'}
function render(){const c=current();if(!c&&state.view!=='home')state.view='home';root.dataset.view=state.view;main.innerHTML=state.view==='home'?home():state.view==='challenge'?challenge(c):result(c);const details=main.querySelector('#fp-questions');if(details)details.addEventListener('toggle',()=>{state.questionOpen=details.open;save()})}
root.addEventListener('click',event=>{const button=event.target.closest('button');if(!button||button.disabled||!root.contains(button))return;if(button.dataset.action==='generate'){generateChallenge();return}if(generating)return;if(button.dataset.case){start(button.dataset.case);return}const c=current();if(button.dataset.clause&&state.view==='challenge'&&c){const id=button.dataset.clause;if(!c.clauses.some(q=>q.id===id))return;state.selected=state.selected.includes(id)?state.selected.filter(s=>s!==id):[...state.selected,id];save();button.setAttribute('aria-pressed',String(state.selected.includes(id)));main.querySelector('#fp-selected').textContent=selectedText();return}if(button.dataset.question&&state.view==='challenge'&&c){if(!c.questions.some(q=>q.id===button.dataset.question))return;state.answer=button.dataset.question;state.questionOpen=true;save();main.querySelectorAll('[data-question]').forEach(el=>el.setAttribute('aria-pressed',String(el.dataset.question===state.answer)));main.querySelector('#fp-reply').innerHTML=answerHTML(c);return}const action=button.dataset.action;if(action==='home'){go('home');return}if(action==='resume'&&c){go('challenge');return}if(action==='submit'&&c&&state.view==='challenge'){const pass=c.clauses.every(q=>state.selected.includes(q.id)===q.risk);if(pass&&!state.completed.includes(c.id))state.completed.push(c.id);go('result');return}if(action==='retry'&&c){start(c.id);return}if(action==='next'&&c){const i=CASES.findIndex(q=>q.id===c.id);const next=CASES.find((q,j)=>j>i&&!state.completed.includes(q.id))||CASES.find(q=>q.id!==c.id&&!state.completed.includes(q.id))||CASES[(i+1)%CASES.length];start(next.id)}});
render();
})();
</script>
